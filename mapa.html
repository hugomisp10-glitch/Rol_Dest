<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voo do Destino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#1b3a8a;--ink:#f4efe0;--mut:#b9c6ee;--y:#ffc400;--ydk:#a87f00;--navy:#0c1a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2159}}
:root[data-theme="dark"]{--bg:#0d2159}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(circle,rgba(255,255,255,.09) 2px,transparent 3px) 0 0/28px 28px;color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 14px 40px}
h1{font:800 clamp(2.2rem,10vw,3.2rem)/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.sub{margin:0 0 12px;color:var(--mut)}
a{color:var(--y);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{font:600 .9rem Barlow,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--mut);border-radius:99px;padding:4px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:var(--navy)}
.stage{position:relative;margin:10px 0 8px;border-radius:18px;overflow:hidden;border:3px solid var(--y);background:#050a1f;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#g{display:block;width:100%;aspect-ratio:1/1;max-height:72vh;margin:0 auto}
#tick{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;text-align:center;color:var(--y);font:800 1.35rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.03em;background:linear-gradient(transparent,rgba(5,10,31,.9))}
button.go{display:block;width:100%;font:800 2.1rem "Barlow Condensed","Arial Narrow",sans-serif;background:var(--y);color:var(--navy);border:0;border-radius:14px;padding:10px;box-shadow:0 6px 0 var(--ydk);cursor:pointer;margin:12px 0 14px}
button.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ydk)}
button:disabled{opacity:.55;cursor:default}
#res .card{padding:14px;border-left:4px solid var(--y);background:rgba(0,0,0,.3);border-radius:0 10px 10px 0;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
#res .t{font:800 2.6rem/1 "Barlow Condensed",sans-serif;margin:4px 0}
.tag{display:inline-block;background:var(--ink);color:var(--navy);border-radius:99px;padding:0 10px;font-weight:600;font-size:.85rem}
.mission{margin:10px 0 0;padding:9px 12px;background:rgba(0,0,0,.28);border-left:4px solid var(--y);border-radius:0 8px 8px 0}
.btn{margin-top:12px;font:600 1rem Barlow,sans-serif;color:var(--ink);background:rgba(0,0,0,.3);border:2px solid var(--mut);border-radius:12px;padding:10px 14px;cursor:pointer}
.xray{margin:10px 0;padding:10px 12px;background:rgba(0,0,0,.28);border-radius:10px}
.xt{font:800 1.25rem "Barlow Condensed",sans-serif;color:var(--y);margin-bottom:6px}
.xr{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:8px;font-size:.92rem;margin:3px 0}
.xr b{text-align:right}.xr s{opacity:.3;text-decoration:none}
.bar{height:9px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y);border-radius:5px;transition:width .6s}
.stp{margin:8px 0 0;font-weight:600;color:var(--y)}
#crew{width:100%;font:400 1rem Barlow,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--mut);background:rgba(0,0,0,.35);color:var(--ink);margin:0 0 4px}
#crew:focus{outline:3px solid var(--y)}
details{margin-top:16px;padding:12px;border-radius:12px;background:rgba(0,0,0,.3)}
summary{cursor:pointer;font:800 1.3rem "Barlow Condensed",sans-serif}
.bar.big{height:12px;margin:10px 0}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamps span{padding:3px 10px;border:2px dashed var(--y);border-radius:8px;color:var(--y);font-weight:600;transform:rotate(-2deg)}
.fm{margin:10px 0;padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(255,196,0,.2),rgba(0,0,0,.3));border:2px solid var(--y)}
.fh{display:flex;justify-content:space-between;font:800 1.2rem "Barlow Condensed",sans-serif;color:var(--y);letter-spacing:.06em}
.pt{margin:8px 0;font-size:1.02rem}.ms{margin:6px 0}
.tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tm span{padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.4);font-size:.85rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:10px 0}
.bd{padding:8px;border-radius:10px;background:rgba(0,0,0,.3);text-align:center;opacity:.55;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border:2px solid var(--y)}.bd span{font-size:1.8rem;display:block}.bd b{display:block;font-size:.9rem}.bd small{display:block;color:var(--mut);font-size:.72rem}
.cf{position:fixed;top:-2rem;font-size:1.6rem;pointer-events:none;z-index:9999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--navy);padding:8px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999}
#toast.on{opacity:1}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>Voo do Destino</h1>
<p class="sub">O avião parte de Lisboa e dá a volta ao globo até aterrar no destino sorteado. <a href="index.html">← Roleta</a></p>
<input id="crew" placeholder="Quem vai? Nomes separados por vírgula (opcional)" autocomplete="off">
<div class="chips" id="ct" role="group" aria-label="Tipo"></div>
<div class="chips" id="cr" role="group" aria-label="Região"></div>
<div class="stage"><canvas id="g" aria-label="Globo com o voo do avião"></canvas><div id="tick" aria-live="polite">Carrega em descolar ✈️</div></div>
<button class="go" id="go">DESCOLAR ✈️</button>
<div id="res" aria-live="polite"></div>
<details id="pass"><summary id="ps"></summary><div class="bar big"><i id="pb" style="width:2%"></i></div><div id="pn" class="sub"></div><div id="bg" class="badges"></div><div id="pl" class="stamps"></div><button class="btn" id="pc">Limpar passaporte</button></details>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="destinos.js"></script>
<script src="coords.js"></script>
<script src="missoes.js"></script>
<script>
const $=s=>document.querySelector(s);
const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.random()*a.length|0];
const TY={P:["Praia","🏖️"],C:["Cidade","🏙️"],N:["Natureza","🌿"],S:["Neve","⛷️"],K:["Cultura","🏛️"],E:["Exótico","🌴"]};
const RG={E:"Europa",A:"Ásia",M:"Américas",F:"África",O:"Oceânia"};
const CAP=["Turbulência sobre {X}…","O piloto pediu indicações a {X}","Escala técnica em {X}","Alguém gritou “é aqui!” sobre {X}","O comandante cheira a {X}","Sobrevoo de {X}, ainda não é desta"];
const MS=["Quem votar contra paga a primeira ronda.","Aprender 3 frases na língua local antes de partir.","O último a fazer a mala paga o jantar de despedida.","Foto de grupo obrigatória a imitar um turista clássico.","Quem chegar atrasado ao aeroporto paga os cafés.","Cada um escolhe um prato local e ninguém troca."];
const G=d=>[C[d.n][1],C[d.n][0]];
const LIS=[-9.1,38.7];
const BYN=Object.fromEntries(D.map(d=>[d.n,d]));
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const PRN=["{P} é o Guia Oficial: escolhe o restaurante do primeiro jantar.","{P} cria o grupo de WhatsApp da viagem e lembra toda a gente do passaporte.","{P} leva a culpa se chover.","{P} fica a tratar das fotos de grupo. Sem desculpas."];
let PASS=[],CREW="",forced=null;
try{PASS=JSON.parse(localStorage.getItem("passaporte")||"[]").filter(n=>BYN[n]);CREW=localStorage.getItem("crew")||""}catch(e){}
const savePass=()=>{try{localStorage.setItem("passaporte",JSON.stringify(PASS))}catch(e){}};
const crew=()=>CREW.split(",").map(s=>s.trim()).filter(Boolean);
const km=g=>{const r=Math.PI/180,a=LIS,h=Math.sin((g[1]-a[1])*r/2)**2+Math.cos(a[1]*r)*Math.cos(g[1]*r)*Math.sin((g[0]-a[0])*r/2)**2;return Math.round(12742*Math.asin(Math.sqrt(h)))};
const fmtT=k=>{const m=Math.round((k/800+.5)*60);return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")};
const lk=d=>location.protocol.startsWith("http")?"\n"+location.origin+location.pathname+"#d="+encodeURIComponent(d.n):"";
try{const hm=decodeURIComponent((location.hash.match(/#d=(.+)/)||[])[1]||"");if(BYN[hm])forced=BYN[hm]}catch(e){}
function xray(d){const k=km(G(d)),B={P:85,C:55,N:50,S:25,K:60,E:70}[d.t],sol=Math.min(100,B+hs(d.n+"s")%16),caos=25+hs(d.n+"c")%75,eu=Math.max(1,Math.min(4,({E:2,A:2,M:3,F:2,O:4})[d.r]+hs(d.n+"e")%3-1));
  const bar=(l,v)=>`<div class="xr"><span>${l}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`;
  return `<div class="xray"><div class="xt">✈️ ${k.toLocaleString("pt-PT")} km · ${fmtT(k)} de voo${k>9000?" (com escala e paciência)":""}</div>${bar("Sol garantido",sol)}${bar("Caos do grupo",caos)}<div class="xr"><span>Orçamento</span><span></span><b>${"€".repeat(eu)}<s>${"€".repeat(4-eu)}</s></b></div></div>`}
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RANKS=[{x:0,e:"🛋️",t:"Turista de Sofá"},{x:300,e:"🎒",t:"Aventureiro de Fim de Semana"},{x:800,e:"🧭",t:"Mochileiro"},{x:1500,e:"🌍",t:"Explorador"},{x:2500,e:"👑",t:"Lenda do Check-in"},{x:4000,e:"🏆",t:"Mestre do Mundo"}];
const rankOf=x=>[...RANKS].reverse().find(k=>x>=k.x);
const stars=d=>{const k=km(G(d));let s=k<1500?1:k<4000?2:k<8000?3:k<12000?4:5;if("NSE".includes(d.t))s=Math.min(5,s+1);return s};
const totalXP=()=>PASS.reduce((a,n)=>a+stars(BYN[n])*100,0)+150*new Set(PASS.map(n=>BYN[n].c)).size;
const ROLES=[["📸","Fotógrafo(a) oficial"],["🧭","Navegador(a)"],["💰","Tesoureiro(a)"],["🍽️","Chef de bordo"],["🗣️","Intérprete"],["🎉","Animador(a)"]];
const PT={P:["é o argumento perfeito contra as segundas-feiras.","é sal, sol e zero desculpas para ficar em casa.","vai fazer a tua vida parecer um postal."],C:["tem mais histórias por esquina do que o teu feed.","é daqueles sítios onde cada rua é uma aventura.","faz-te sentir turista de luxo com pés de explorador."],N:["é o botão de reset que a tua cabeça pede.","dá-te paisagens que nenhum ecrã consegue imitar.","vai deixar-te sem rede e com a alma cheia."],S:["é perfeito para trocar o escritório por neve fresca.","tem o cenário ideal para chocolate quente e fotos épicas.","promete quedas épicas e histórias ainda melhores."],K:["faz-te viajar no tempo sem sair do sítio.","é uma aula de história que vais querer repetir.","é daqueles sítios que se contam durante anos."],E:["é o tipo de viagem que muda a conversa à mesa.","fica longe, mas fica contigo para sempre.","dá-te histórias que mais ninguém do grupo tem."]};
const BD=[["✈️","Primeiro voo","1 carimbo",()=>PASS.length>=1],["🏖️","Rei da Praia","3 praias",c=>c("P")>=3],["🏙️","Citadino","3 cidades",c=>c("C")>=3],["🌿","Montanhista","3 de natureza",c=>c("N")>=3],["⛷️","Esquiador","2 de neve",c=>c("S")>=2],["🏛️","Culturista","3 de cultura",c=>c("K")>=3],["🌴","Aventureiro Exótico","3 exóticos",c=>c("E")>=3],["🇪🇺","Europeu convicto","5 na Europa",(c,r,e)=>e>=5],["🌍","Volta ao Mundo","as 5 regiões",(c,r)=>r.size>=5],["🛫","Longo Curso","a +10 000 km",()=>PASS.some(n=>km(G(BYN[n]))>10000)],["📚","Colecionador","10 carimbos",()=>PASS.length>=10],["🏆","Meio Centenário","50 carimbos",()=>PASS.length>=50]];
const badges=()=>{const c=t=>PASS.filter(n=>BYN[n].t===t).length,r=new Set(PASS.map(n=>BYN[n].r)),e=PASS.filter(n=>BYN[n].r==="E").length;return BD.map(([i,t,d,f])=>({e:i,t,d,ok:!!f(c,r,e)}))};
function ficha(d,gain){const s=stars(d),k=km(G(d)),P=PT[d.t],cr=crew(),ro=[...ROLES].sort(()=>Math.random()-.5);
  const pt="Fica a "+k.toLocaleString("pt-PT")+" km de Lisboa ("+fmtT(k)+" de voo) e "+P[hs(d.n)%P.length];
  return `<div class="fm"><div class="fh"><span>NÍVEL ${s} ${"★".repeat(s)}${"☆".repeat(5-s)}</span><b>${gain?"+"+gain+" XP":"sem XP (repetido)"}</b></div><p class="pt">${esc(pt)}</p><p class="ms">🎯 <b>Missão principal:</b> ${esc(MI[d.n]||"")}</p>${cr.length?`<div class="tm">${cr.map((c,i)=>`<span>${ro[i%ro.length][0]} ${esc(c)}: ${ro[i%ro.length][1]}</span>`).join("")}</div>`:""}</div>`}
function renderPass(){const x=totalXP(),r=rankOf(x),nx=RANKS.find(k=>k.x>x);
  $("#ps").textContent="🛂 "+r.e+" "+r.t+" · "+x+" XP · "+PASS.length+" carimbos";$("#pb").style.width=Math.max(2,nx?(x-r.x)/(nx.x-r.x)*100:100)+"%";
  $("#pn").textContent=nx?"Faltam "+(nx.x-x)+" XP para "+nx.e+" "+nx.t:"Nível máximo atingido!";
  $("#bg").innerHTML=badges().map(b=>`<div class="bd ${b.ok?"on":""}"><span>${b.ok?b.e:"🔒"}</span><b>${b.t}</b><small>${b.d}</small></div>`).join("");
  $("#pl").innerHTML=PASS.map(n=>`<span>${BYN[n].f} ${n}</span>`).join("")||"Ainda sem carimbos. Descola! ✈️"}
async function boarding(){const {d}=res,h=hs(d.n),c=document.createElement("canvas");c.width=1000;c.height=440;const x=c.getContext("2d"),F='"Barlow Condensed","Arial Narrow",sans-serif',B="Barlow,sans-serif";
  x.fillStyle="#f4efe0";x.fillRect(0,0,1000,440);x.fillStyle="#1b3a8a";x.fillRect(0,0,1000,74);x.fillStyle="#ffc400";x.font=`800 38px ${F}`;x.textBaseline="middle";x.fillText("✈ CARTÃO DE EMBARQUE · ROLETA DO DESTINO",28,38);
  x.fillStyle="#0c1a45";x.font=`600 22px ${B}`;x.fillText("DE",28,110);x.fillText("PARA",28,215);
  x.font=`800 70px ${F}`;x.fillText("🇵🇹 LISBOA",28,158);x.font=`800 ${d.n.length>12?58:80}px ${F}`;x.fillText(d.f+" "+d.n.toUpperCase(),28,268);
  [["VOO","RD "+(100+h%900)],["PORTA","P"+(1+h%30)],["LUGAR",(1+h%30)+"ABCDEF"[h%6]],["EMBARQUE",String(5+h%18).padStart(2,"0")+":"+["00","15","30","45"][h%4]]].forEach(([l,v],i)=>{
    x.fillStyle="#6b7bb0";x.font=`600 20px ${B}`;x.fillText(l,28+i*165,330);x.fillStyle="#0c1a45";x.font=`800 40px ${F}`;x.fillText(v,28+i*165,370)});
  const cr=crew();x.fillStyle="#6b7bb0";x.font=`600 20px ${B}`;x.fillText(cr.length?"PASSAGEIROS: "+cr.join(", ").slice(0,58):"PASSAGEIROS: o grupo inteiro",28,414);
  x.setLineDash([8,8]);x.strokeStyle="#1b3a8a";x.lineWidth=3;x.beginPath();x.moveTo(720,90);x.lineTo(720,430);x.stroke();x.setLineDash([]);
  x.fillStyle="#0c1a45";x.font=`800 30px ${F}`;x.fillText(d.f+" "+d.n.toUpperCase().slice(0,12),750,130);x.font=`600 20px ${B}`;x.fillText(km(G(d)).toLocaleString("pt-PT")+" km",750,168);
  let bx=750,sd=h;while(bx<960){sd=(sd*1103515245+12345)>>>0;const w=2+sd%6;x.fillRect(bx,215,w,150);bx+=w+2+(sd>>8)%4}
  c.toBlob(async b=>{const f=new File([b],"cartao-embarque.png",{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;a.click();toast("Cartão guardado")},"image/png")}
let tipo="*",reg="*",seen=new Set(),busy=false,hold=false,res=null;
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)};
function chips(el,items,set){items.forEach(([k,l],i)=>{const b=document.createElement("button");b.textContent=l;b.setAttribute("aria-pressed",i===0);
  b.onclick=()=>{set(k);[...el.children].forEach(x=>x.setAttribute("aria-pressed",x===b))};el.appendChild(b)})}
chips($("#ct"),[["*","Pura sorte 🎲"],...Object.entries(TY).map(([k,v])=>[k,v[1]+" "+v[0]])],k=>tipo=k);
chips($("#cr"),[["*","Mundo 🌍"],...Object.entries(RG)],k=>reg=k);
function confetti(){if(RM())return;for(let i=0;i<40;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(["🎉","✈️","🏖️","🎊","🌍","🥳"]);
  s.style.left=Math.random()*100+"%";s.style.animationDuration=2.5+Math.random()*2.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}

/* ---------- globo ---------- */
const cv=$("#g"),ctx=cv.getContext("2d");
let W=320,dpr=1,BASE=128,S=128,cen=LIS.slice(),H=null,trails=[],pins=[],last=LIS.slice(),planeOn=false,ang=0,ripple=null,land=null,borders=null,proj,path;
const ST=Array.from({length:120},()=>[Math.random(),Math.random(),Math.random()*1.3+.3,Math.random()*6]);
const GRAT=window.d3?d3.geoGraticule10():null;
function size(){W=cv.clientWidth||320;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=W*dpr;BASE=W*.4;if(!H&&!hold)S=BASE}
if(window.d3){
  proj=d3.geoOrthographic().clipAngle(90).precision(.6);path=d3.geoPath(proj,ctx);
  size();addEventListener("resize",size);
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json()).then(t=>{land=topojson.feature(t,t.objects.land);borders=topojson.mesh(t,t.objects.countries,(a,b)=>a!==b)})
    .catch(()=>{$("#tick").textContent="Sem contornos de países (sem ligação), mas o voo funciona ✈️"});
  requestAnimationFrame(frame);
}else{$("#tick").textContent="Não foi possível carregar o globo. Verifica a ligação à internet.";$("#go").disabled=true}
function vis(g){return d3.geoDistance(g,cen)<Math.PI/2-.04}
function label(p,text,big){ctx.font=`600 ${big?15:12}px Barlow,sans-serif`;const w=ctx.measureText(text).width+14,h=big?26:20,x=p[0]-w/2,y=p[1]-h-(big?14:9);
  ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,8):ctx.rect(x,y,w,h);ctx.fillStyle="rgba(12,26,69,.92)";ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#ffc400";ctx.stroke();
  ctx.fillStyle="#f4efe0";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,p[0],y+h/2+1)}
function frame(t){
  if(H){const k=Math.min(1,(t-H.t0)/H.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;H.k=k;H.e=e;cen=H.i(e);S=(H.s0+(H.s1-H.s0)*e)*(1-.16*Math.sin(Math.PI*k));
    if(k>=1){cen=H.to.slice();S=H.s1;trails.push([H.from,H.to]);last=H.to;const r=H.res;H=null;r()}}
  else if(!busy&&!hold&&!RM()){cen=[cen[0]+.06,cen[1]+(18-cen[1])*.01]}
  draw(t);requestAnimationFrame(frame)}
function draw(t){
  const c=W/2;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,W);
  const bg=ctx.createLinearGradient(0,0,0,W);bg.addColorStop(0,"#050a1f");bg.addColorStop(1,"#0a1640");ctx.fillStyle=bg;ctx.fillRect(0,0,W,W);
  ST.forEach(s=>{ctx.globalAlpha=.35+.5*Math.abs(Math.sin(t/900+s[3]));ctx.fillStyle="#fff";ctx.fillRect(s[0]*W,s[1]*W,s[2],s[2])});ctx.globalAlpha=1;
  proj.scale(S).translate([c,c]).rotate([-cen[0],-cen[1]]);

  ctx.fillStyle=at;ctx.beginPath();ctx.arc(c,c,S*1.28,0,7);ctx.fill();

  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=oc;ctx.fill();

  if(land){ctx.beginPath();path(land);ctx.fillStyle="#4a82e8";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=.5;ctx.stroke();
    ctx.beginPath();path(borders);ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=.5;ctx.stroke()}
  const sh=ctx.createRadialGradient(c-S*.3,c-S*.3,S*.45,c,c,S*1.02);sh.addColorStop(0,"rgba(0,0,20,0)");sh.addColorStop(1,"rgba(0,0,20,.55)");
  ctx.beginPath();ctx.arc(c,c,S,0,7);ctx.fillStyle=sh;ctx.fill();
  ctx.lineCap="round";ctx.setLineDash([6,7]);ctx.lineWidth=2;ctx.strokeStyle="#ffc400";
  trails.forEach(([a,b])=>{ctx.beginPath();path({type:"LineString",coordinates:[a,b]});ctx.stroke()});
  if(H&&H.e>.002){ctx.beginPath();path({type:"LineString",coordinates:[H.from,cen]});ctx.stroke()}
  ctx.setLineDash([]);
  if(ripple&&vis(ripple.g)){const p=proj(ripple.g);for(let i=0;i<3;i++){const ph=((t-ripple.t)/1500+i/3)%1;ctx.beginPath();ctx.arc(p[0],p[1],6+ph*S*.22,0,7);ctx.strokeStyle=`rgba(255,196,0,${1-ph})`;ctx.lineWidth=2.5;ctx.stroke()}}
  PASS.forEach(n=>{const g=G(BYN[n]);if(vis(g)){const q=proj(g);ctx.beginPath();ctx.arc(q[0],q[1],2.6,0,7);ctx.fillStyle="rgba(255,196,0,.75)";ctx.fill()}});
  pins.forEach(p=>{if(!vis(p.g))return;const q=proj(p.g);ctx.shadowColor=p.k==="near"?"#ff7a7a":"#ffc400";ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(q[0],q[1],p.k==="win"?7:4.5,0,7);ctx.fillStyle=p.k==="near"?"#ff7a7a":p.k==="o"?"#f4efe0":"#ffc400";ctx.fill();ctx.shadowBlur=0;label(q,p.l,p.k==="win")});
  if(planeOn){const pos=H?cen:last;if(H){const a=proj(cen),b=proj(H.i(Math.min(1,H.e+.02)));if(a&&b)ang=Math.atan2(b[1]-a[1],b[0]-a[0])}
    const q=proj(pos);if(q&&vis(pos)){ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(ang+Math.PI/4);ctx.shadowColor="#000";ctx.shadowBlur=10;ctx.font="30px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("✈️",0,0);ctx.restore()}}
  ctx.beginPath();ctx.arc(c,c,S,0,7);ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=1;ctx.stroke()}
function fly(from,to,dur,s1){return new Promise(res=>{
  if(!dur||RM()){cen=to.slice();S=s1;trails.push([from,to]);last=to;return res()}
  H={from,to,i:d3.geoInterpolate(from,to),t0:performance.now(),dur,s0:S,s1,res,k:0,e:0}})}
async function hop(d,kind){
  const g=G(d);$("#tick").textContent=kind==="win"?"Aterragem autorizada! 🛬":kind==="near"?"Quase em "+d.n+"… mas não! 😬":pick(CAP).replace("{X}",d.n);
  await fly(last,g,kind==="win"?3300:kind==="near"?2100:2400,kind==="win"?BASE*1.9:BASE);
  pins.push({g,l:d.f+" "+d.n,k:kind});if(kind==="win")ripple={g,t:performance.now()}}
$("#go").onclick=async()=>{
  if(busy)return;busy=true;hold=false;$("#go").disabled=true;$("#res").innerHTML="";res=null;ripple=null;
  let pool=D.filter(d=>(tipo==="*"||d.t===tipo)&&(reg==="*"||d.r===reg));
  if(!pool.length){pool=D.filter(d=>tipo==="*"||d.t===tipo);toast("Sem destinos nessa combinação: ignorei a região")}

  planeOn=false;hold=true;const cr=crew(),m=cr.length&&Math.random()<.6?pick(PRN).replace("{P}",pick(cr)):pick(MS),isNew=!PASS.includes(w.n),xp0=totalXP(),bb0=new Set(badges().filter(b=>b.ok).map(b=>b.t));if(isNew){PASS.unshift(w.n);savePass()}const gain=totalXP()-xp0,r0=rankOf(xp0),r1=rankOf(totalXP()),bdg=badges().filter(b=>b.ok&&!bb0.has(b.t)).map(b=>`<p class="stp">🏅 Nova conquista: ${b.e} ${b.t}!</p>`).join("")+(r1.t!==r0.t?`<p class="stp">⭐ Subiste a ${r1.e} ${r1.t}!</p>`:"");res={d:w,m};

  $("#sh").onclick=share;$("#bp").onclick=boarding;$("#vg").onclick=()=>{try{localStorage.setItem("viagem-destino",res.d.n)}catch(e){}};renderPass();$("#tick").textContent="Bem-vindos a "+w.n+"! 🎉";confetti();busy=false;$("#go").disabled=false;$("#go").textContent="DESCOLAR DE NOVO ✈️"};
async function share(){const {d,m}=res,txt=`✈️ O avião aterrou em: ${d.n} ${d.f} (${d.c})\n“${d.s}”\nMissão: ${m}\n🎯 ${MI[d.n]}\nJá podem reclamar. 🌍${lk(d)}`;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}

  catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado! Cola no grupo")}catch(_){toast("Não deu para copiar")}a.remove()}}

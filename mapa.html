<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voo do Destino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#1b3a8a;--ink:#f4efe0;--mut:#b9c6ee;--y:#ffc400;--ydk:#a87f00;--navy:#0c1a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2159}}
:root[data-theme="dark"]{--bg:#0d2159}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(circle,rgba(255,255,255,.09) 2px,transparent 3px) 0 0/28px 28px;color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 14px 40px}
h1{font:800 clamp(2.2rem,10vw,3.2rem)/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.sub{margin:0 0 12px;color:var(--mut)}
a{color:var(--y);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{font:600 .9rem Barlow,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--mut);border-radius:99px;padding:4px 11px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:var(--navy)}
.stage{position:relative;margin:10px 0 8px;border-radius:18px;overflow:hidden;border:3px solid var(--y);background:#050a1f;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#g{display:block;width:100%;aspect-ratio:1/1;max-height:72vh;margin:0 auto}
#tick{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;text-align:center;color:var(--y);font:800 1.35rem/1.1 "Barlow Condensed",sans-serif;letter-spacing:.03em;background:linear-gradient(transparent,rgba(5,10,31,.9))}
button.go{display:block;width:100%;font:800 2.1rem "Barlow Condensed","Arial Narrow",sans-serif;background:var(--y);color:var(--navy);border:0;border-radius:14px;padding:10px;box-shadow:0 6px 0 var(--ydk);cursor:pointer;margin:12px 0 14px}
button.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ydk)}
button:disabled{opacity:.55;cursor:default}
#res .card{padding:14px;border-left:4px solid var(--y);background:rgba(0,0,0,.3);border-radius:0 10px 10px 0;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
#res .t{font:800 2.6rem/1 "Barlow Condensed",sans-serif;margin:4px 0}
.tag{display:inline-block;background:var(--ink);color:var(--navy);border-radius:99px;padding:0 10px;font-weight:600;font-size:.85rem}
.mission{margin:10px 0 0;padding:9px 12px;background:rgba(0,0,0,.28);border-left:4px solid var(--y);border-radius:0 8px 8px 0}
.btn{margin-top:12px;font:600 1rem Barlow,sans-serif;color:var(--ink);background:rgba(0,0,0,.3);border:2px solid var(--mut);border-radius:12px;padding:10px 14px;cursor:pointer}
.cf{position:fixed;top:-2rem;font-size:1.6rem;pointer-events:none;z-index:9999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--navy);padding:8px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999}
#toast.on{opacity:1}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<h1>Voo do Destino</h1>
<p class="sub">O avião parte de Lisboa e dá a volta ao globo até aterrar no destino sorteado. <a href="index.html">← Roleta</a></p>
<div class="chips" id="ct" role="group" aria-label="Tipo"></div>
<div class="chips" id="cr" role="group" aria-label="Região"></div>
<div class="stage"><canvas id="g" aria-label="Globo com o voo do avião"></canvas><div id="tick" aria-live="polite">Carrega em descolar ✈️</div></div>
<button class="go" id="go">DESCOLAR ✈️</button>
<div id="res" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="destinos.js"></script>
<script src="coords.js"></script>
<script>
const $=s=>document.querySelector(s);
const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.random()*a.length|0];
const TY={P:["Praia","🏖️"],C:["Cidade","🏙️"],N:["Natureza","🌿"],S:["Neve","⛷️"],K:["Cultura","🏛️"],E:["Exótico","🌴"]};
const RG={E:"Europa",A:"Ásia",M:"Américas",F:"África",O:"Oceânia"};
const CAP=["Turbulência sobre {X}…","O piloto pediu indicações a {X}","Escala técnica em {X}","Alguém gritou “é aqui!” sobre {X}","O comandante cheira a {X}","Sobrevoo de {X}, ainda não é desta"];
const MS=["Quem votar contra paga a primeira ronda.","Aprender 3 frases na língua local antes de partir.","O último a fazer a mala paga o jantar de despedida.","Foto de grupo obrigatória a imitar um turista clássico.","Quem chegar atrasado ao aeroporto paga os cafés.","Cada um escolhe um prato local e ninguém troca."];
const G=d=>[C[d.n][1],C[d.n][0]];
const LIS=[-9.1,38.7];
let tipo="*",reg="*",seen=new Set(),busy=false,hold=false,res=null;
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)};
function chips(el,items,set){items.forEach(([k,l],i)=>{const b=document.createElement("button");b.textContent=l;b.setAttribute("aria-pressed",i===0);
  b.onclick=()=>{set(k);[...el.children].forEach(x=>x.setAttribute("aria-pressed",x===b))};el.appendChild(b)})}
chips($("#ct"),[["*","Pura sorte 🎲"],...Object.entries(TY).map(([k,v])=>[k,v[1]+" "+v[0]])],k=>tipo=k);
chips($("#cr"),[["*","Mundo 🌍"],...Object.entries(RG)],k=>reg=k);
function confetti(){if(RM())return;for(let i=0;i<40;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(["🎉","✈️","🏖️","🎊","🌍","🥳"]);
  s.style.left=Math.random()*100+"%";s.style.animationDuration=2.5+Math.random()*2.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}

/* ---------- globo ---------- */
const cv=$("#g"),ctx=cv.getContext("2d");
let W=320,dpr=1,BASE=128,S=128,cen=LIS.slice(),H=null,trails=[],pins=[],last=LIS.slice(),planeOn=false,ang=0,ripple=null,land=null,borders=null,proj,path;
const ST=Array.from({length:120},()=>[Math.random(),Math.random(),Math.random()*1.3+.3,Math.random()*6]);
const GRAT=window.d3?d3.geoGraticule10():null;
function size(){W=cv.clientWidth||320;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=W*dpr;BASE=W*.4;if(!H&&!hold)S=BASE}
if(window.d3){
  proj=d3.geoOrthographic().clipAngle(90).precision(.6);path=d3.geoPath(proj,ctx);
  size();addEventListener("resize",size);
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json()).then(t=>{land=topojson.feature(t,t.objects.land);borders=topojson.mesh(t,t.objects.countries,(a,b)=>a!==b)})
    .catch(()=>{$("#tick").textContent="Sem contornos de países (sem ligação), mas o voo funciona ✈️"});
  requestAnimationFrame(frame);
}else{$("#tick").textContent="Não foi possível carregar o globo. Verifica a ligação à internet.";$("#go").disabled=true}
function vis(g){return d3.geoDistance(g,cen)<Math.PI/2-.04}
function label(p,text,big){ctx.font=`600 ${big?15:12}px Barlow,sans-serif`;const w=ctx.measureText(text).width+14,h=big?26:20,x=p[0]-w/2,y=p[1]-h-(big?14:9);
  ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,8):ctx.rect(x,y,w,h);ctx.fillStyle="rgba(12,26,69,.92)";ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#ffc400";ctx.stroke();
  ctx.fillStyle="#f4efe0";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,p[0],y+h/2+1)}
function frame(t){
  if(H){const k=Math.min(1,(t-H.t0)/H.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;H.k=k;H.e=e;cen=H.i(e);S=(H.s0+(H.s1-H.s0)*e)*(1-.16*Math.sin(Math.PI*k));
    if(k>=1){cen=H.to.slice();S=H.s1;trails.push([H.from,H.to]);last=H.to;const r=H.res;H=null;r()}}
  else if(!busy&&!hold&&!RM()){cen=[cen[0]+.06,cen[1]+(18-cen[1])*.01]}
  draw(t);requestAnimationFrame(frame)}
function draw(t){
  const c=W/2;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,W);
  const bg=ctx.createLinearGradient(0,0,0,W);bg.addColorStop(0,"#050a1f");bg.addColorStop(1,"#0a1640");ctx.fillStyle=bg;ctx.fillRect(0,0,W,W);
  ST.forEach(s=>{ctx.globalAlpha=.35+.5*Math.abs(Math.sin(t/900+s[3]));ctx.fillStyle="#fff";ctx.fillRect(s[0]*W,s[1]*W,s[2],s[2])});ctx.globalAlpha=1;
  proj.scale(S).translate([c,c]).rotate([-cen[0],-cen[1]]);
  const at=ctx.createRadialGradient(c,c,S*.96,c,c,S*1.28);at.addColorStop(0,"rgba(110,170,255,.6)");at.addColorStop(1,"rgba(110,170,255,0)");
  ctx.fillStyle=at;ctx.beginPath();ctx.arc(c,c,S*1.28,0,7);ctx.fill();
  const oc=ctx.createRadialGradient(c-S*.35,c-S*.4,S*.1,c,c,S);oc.addColorStop(0,"#2c5bd0");oc.addColorStop(1,"#08153f");
  ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=oc;ctx.fill();
  ctx.beginPath();path(GRAT);ctx.strokeStyle="rgba(255,255,255,.07)";ctx.lineWidth=.6;ctx.stroke();
  if(land){ctx.beginPath();path(land);ctx.fillStyle="#4a82e8";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=.5;ctx.stroke();
    ctx.beginPath();path(borders);ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=.5;ctx.stroke()}
  const sh=ctx.createRadialGradient(c-S*.3,c-S*.3,S*.45,c,c,S*1.02);sh.addColorStop(0,"rgba(0,0,20,0)");sh.addColorStop(1,"rgba(0,0,20,.55)");
  ctx.beginPath();ctx.arc(c,c,S,0,7);ctx.fillStyle=sh;ctx.fill();
  ctx.lineCap="round";ctx.setLineDash([6,7]);ctx.lineWidth=2;ctx.strokeStyle="#ffc400";
  trails.forEach(([a,b])=>{ctx.beginPath();path({type:"LineString",coordinates:[a,b]});ctx.stroke()});
  if(H&&H.e>.002){ctx.beginPath();path({type:"LineString",coordinates:[H.from,cen]});ctx.stroke()}
  ctx.setLineDash([]);
  if(ripple&&vis(ripple.g)){const p=proj(ripple.g);for(let i=0;i<3;i++){const ph=((t-ripple.t)/1500+i/3)%1;ctx.beginPath();ctx.arc(p[0],p[1],6+ph*S*.22,0,7);ctx.strokeStyle=`rgba(255,196,0,${1-ph})`;ctx.lineWidth=2.5;ctx.stroke()}}
  pins.forEach(p=>{if(!vis(p.g))return;const q=proj(p.g);ctx.shadowColor=p.k==="near"?"#ff7a7a":"#ffc400";ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(q[0],q[1],p.k==="win"?7:4.5,0,7);ctx.fillStyle=p.k==="near"?"#ff7a7a":p.k==="o"?"#f4efe0":"#ffc400";ctx.fill();ctx.shadowBlur=0;label(q,p.l,p.k==="win")});
  if(planeOn){const pos=H?cen:last;if(H){const a=proj(cen),b=proj(H.i(Math.min(1,H.e+.02)));if(a&&b)ang=Math.atan2(b[1]-a[1],b[0]-a[0])}
    const q=proj(pos);if(q&&vis(pos)){ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(ang+Math.PI/4);ctx.shadowColor="#000";ctx.shadowBlur=10;ctx.font="30px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("✈️",0,0);ctx.restore()}}
  ctx.beginPath();ctx.arc(c,c,S,0,7);ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=1;ctx.stroke()}
function fly(from,to,dur,s1){return new Promise(res=>{
  if(!dur||RM()){cen=to.slice();S=s1;trails.push([from,to]);last=to;return res()}
  H={from,to,i:d3.geoInterpolate(from,to),t0:performance.now(),dur,s0:S,s1,res,k:0,e:0}})}
async function hop(d,kind){
  const g=G(d);$("#tick").textContent=kind==="win"?"Aterragem autorizada! 🛬":kind==="near"?"Quase em "+d.n+"… mas não! 😬":pick(CAP).replace("{X}",d.n);
  await fly(last,g,kind==="win"?3300:kind==="near"?2100:2400,kind==="win"?BASE*1.9:BASE);
  pins.push({g,l:d.f+" "+d.n,k:kind});if(kind==="win")ripple={g,t:performance.now()}}
$("#go").onclick=async()=>{
  if(busy)return;busy=true;hold=false;$("#go").disabled=true;$("#res").innerHTML="";res=null;ripple=null;
  let pool=D.filter(d=>(tipo==="*"||d.t===tipo)&&(reg==="*"||d.r===reg));
  if(!pool.length){pool=D.filter(d=>tipo==="*"||d.t===tipo);toast("Sem destinos nessa combinação: ignorei a região")}
  let fresh=pool.filter(d=>!seen.has(d.n));if(!fresh.length){pool.forEach(d=>seen.delete(d.n));fresh=pool}
  const w=pick(fresh);seen.add(w.n);
  const dec=D.filter(d=>d.c!==w.c).sort(()=>Math.random()-.5).slice(0,5),nr=D.filter(d=>d.c===w.c&&d.n!==w.n);
  const route=dec.map(d=>[d,"fly"]);if(nr.length)route.push([pick(nr),"near"]);route.push([w,"win"]);
  trails=[];pins=[{g:LIS,l:"🇵🇹 Lisboa",k:"o"}];last=LIS.slice();planeOn=true;S=BASE;
  $("#tick").textContent="A descolar de Lisboa… 🛫";
  await fly(cen,LIS,RM()?0:1400,BASE);trails=[];await sleep(RM()?100:500);
  for(const [d,k] of route){await hop(d,k);await sleep(RM()?100:k==="near"?1400:k==="win"?300:600)}
  planeOn=false;hold=true;const m=pick(MS);res={d:w,m};
  $("#res").innerHTML=`<div class="card"><span class="tag">${TY[w.t][1]} ${TY[w.t][0]}</span><div class="t">${w.f} ${w.n}</div><div>${w.c}</div><p><i>“${w.s}”</i></p><p class="mission"><b>Missão do grupo:</b> ${m}</p><button class="btn" id="sh">Partilhar 📲</button></div>`;
  $("#sh").onclick=share;$("#tick").textContent="Bem-vindos a "+w.n+"! 🎉";confetti();busy=false;$("#go").disabled=false;$("#go").textContent="DESCOLAR DE NOVO ✈️"};
async function share(){const {d,m}=res,txt=`✈️ O avião aterrou em: ${d.n} ${d.f} (${d.c})\n“${d.s}”\nMissão: ${m}\nJá podem reclamar. 🌍`;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);toast("Copiado! Cola no grupo")}
  catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado! Cola no grupo")}catch(_){toast("Não deu para copiar")}a.remove()}}
</script>
</body>
</html>

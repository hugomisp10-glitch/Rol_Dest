<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roleta do Destino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#1b3a8a;--ink:#f4efe0;--mut:#b9c6ee;--y:#ffc400;--ydk:#a87f00;--navy:#0c1a45;--cf:"Barlow Condensed","Arial Narrow",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2159}}
:root[data-theme="dark"]{--bg:#0d2159}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(circle,rgba(255,255,255,.09) 2px,transparent 3px) 0 0/28px 28px;color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 14px 40px}
header{text-align:center;margin-bottom:16px}
.plane{font-size:2.6rem;display:inline-block;animation:fly 5s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(-26px,4px) rotate(-4deg)}50%{transform:translate(26px,-6px) rotate(8deg)}}
h1{font:800 clamp(2.8rem,14vw,4.2rem)/.9 var(--cf);margin:2px 0 8px;text-transform:uppercase}
h1 span{color:var(--y)}
.sub{margin:0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stats div{padding:10px 6px;border-radius:14px;background:rgba(0,0,0,.35);text-align:center}
.stats b{display:block;font:800 1.7rem/1 var(--cf);color:var(--y)}
.stats small{color:var(--mut);font-size:.78rem}
.rank{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;font:800 1.4rem var(--cf);text-transform:uppercase}
.rank i{font-style:normal;font-size:2rem}
.dd{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:16px;border-radius:18px;text-decoration:none;color:var(--ink);background:linear-gradient(135deg,rgba(255,196,0,.28),rgba(0,0,0,.35));border:2px solid var(--y)}
.dd .fl{font-size:3.4rem;line-height:1}
.dd small{color:var(--y);font:800 .95rem var(--cf);letter-spacing:.12em;text-transform:uppercase}
.dd b{display:block;font:800 1.9rem/1 var(--cf);text-transform:uppercase}
.dd p{margin:3px 0 0;color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px 12px 14px;border-radius:20px;text-decoration:none;color:var(--ink);background:linear-gradient(145deg,var(--c),#0b1550 90%);border:2px solid rgba(255,255,255,.18);box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .1s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.ic{font-size:3.1rem;line-height:1.05;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.tile b{font:800 1.45rem/1 var(--cf);text-transform:uppercase}
.tile span{color:rgba(244,239,224,.8);font-size:.85rem;line-height:1.25}
footer{margin-top:22px;text-align:center;color:var(--mut);font-size:.85rem}
a:focus-visible{outline:3px solid var(--y);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<header><div class="plane">✈️</div><h1>Roleta do <span>Destino</span></h1><p class="sub">Para as férias deixarem de ser uma discussão.</p></header>
<section class="stats" id="st"></section>
<a class="dd" id="dd" href="mapa.html"></a>
<nav class="grid" id="gr" aria-label="Menu"></nav>
<footer>Origem: Portugal 🇵🇹 · 400 destinos</footer>
</main>
<script src="destinos.js"></script>
<script src="coords.js"></script>
<script src="missoes.js"></script>
<script src="jogo.js"></script>
<script>
const $=s=>document.querySelector(s);
const TILES=[["🎡","Roleta","Sorteio puro ou por tipo","roleta.html","#a67c00"],["🌍","Voo no globo","O avião escolhe por ti","mapa.html","#0f7f86"],["🔎","Pede ao Destino","Descreve a viagem e recebe ideias","sugestor.html","#7a4fd0"],["🏆","Sorteio dos amigos","Cada um sugere em segredo","sorteio-amigos.html","#c4453f"],["⚔️","Duelo","Dois destinos, um vencedor","duelo.html","#d0731a"],["🧠","Quiz do mundo","Testa a tua geografia","quiz.html","#2e8f55"],["🧳","Painel da viagem","Mistério, contagem e mala","viagem.html","#2f64d6"]];
$("#gr").innerHTML=TILES.map(([i,t,d,h,c])=>`<a class="tile" href="${h}" style="--c:${c}"><span class="ic" aria-hidden="true">${i}</span><b>${t}</b><span>${d}</span></a>`).join("");
const x=totalXP(),r=rankOf(x),nb=badges().filter(b=>b.ok).length;
$("#st").innerHTML=`<div class="rank"><i>${r.e}</i>${r.t}</div><div><b>${x}</b><small>XP</small></div><div><b>${PASS.length}</b><small>carimbos</small></div><div><b>${nb}/${BD.length}</b><small>conquistas</small></div>`;
const d=D[hs(new Date().toISOString().slice(0,10))%D.length];
$("#dd").href="mapa.html#d="+encodeURIComponent(d.n);
$("#dd").innerHTML=`<span class="fl">${d.f}</span><div><small>✨ Destino do dia</small><b>${esc(d.n)}</b><p>“${esc(d.s)}”</p><p>🎯 ${esc(MI[d.n]||"")}</p></div>`;
</script>
</body>
</html>

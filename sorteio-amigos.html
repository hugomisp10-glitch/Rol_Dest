<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteio dos Amigos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#1b3a8a;--ink:#f4efe0;--mut:#b9c6ee;--y:#ffc400;--ydk:#a87f00;--navy:#0c1a45;--red:#ff7a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2159}}
:root[data-theme="dark"]{--bg:#0d2159}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(circle,rgba(255,255,255,.09) 2px,transparent 3px) 0 0/28px 28px;color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 14px 40px}
h1{font:800 clamp(2.2rem,10vw,3.2rem)/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.sub{margin:0 0 14px;color:var(--mut)}
a{color:var(--y);font-weight:600}
input{width:100%;font:400 1.15rem Barlow,sans-serif;padding:13px 12px;border-radius:12px;border:2px solid var(--mut);background:rgba(0,0,0,.35);color:var(--ink);margin-bottom:10px}
input:focus{outline:3px solid var(--y);border-color:var(--y)}
.btn{font:600 1rem Barlow,sans-serif;color:var(--ink);background:rgba(0,0,0,.3);border:2px solid var(--mut);border-radius:12px;padding:11px 14px;cursor:pointer}
.btn.y{background:var(--y);color:var(--navy);border-color:var(--y)}
.btn.w{display:block;width:100%;margin-top:10px}
button.go{display:block;width:100%;font:800 2rem "Barlow Condensed","Arial Narrow",sans-serif;background:var(--y);color:var(--navy);border:0;border-radius:14px;padding:10px;box-shadow:0 6px 0 var(--ydk);cursor:pointer;margin:12px 0}
button.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ydk)}
button:disabled{opacity:.5;cursor:default}
.lock{color:var(--y);font-weight:600;margin:12px 0 0}
.cover{text-align:center;padding:28px 10px}
.cover .big{font-size:4rem;line-height:1}
.cover h2{font:800 2.2rem/1 "Barlow Condensed",sans-serif;margin:10px 0 8px}
#stage{min-height:230px;text-align:center;padding:18px 12px;background:rgba(0,0,0,.3);border-radius:14px}
#stage .t{font:800 2.8rem/1 "Barlow Condensed",sans-serif;margin:6px 0}
#stage .out{font:800 1.3rem "Barlow Condensed",sans-serif;color:var(--red);letter-spacing:.08em}
#stage.win{border:3px solid var(--y)}
#stage.win .out{color:var(--y)}
#stage .pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.left{margin-top:8px;color:var(--y);font-weight:600}
#log{list-style:none;padding:0;margin:14px 0 0}
#log li{padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.25);margin-bottom:6px;color:var(--mut);text-decoration:line-through;text-decoration-color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.acts .btn{flex:1 1 40%}
.cf{position:fixed;top:-2rem;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--navy);padding:8px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#stage .pop{animation:none}}
</style>
</head>
<body>
<main>
<h1>Sorteio dos Amigos</h1>
<p class="sub">Passem o telemóvel: cada um escreve o seu destino em segredo. Depois vão sendo revelados os eliminados até sobrar o vencedor. <a href="index.html">← Roleta</a></p>

<section id="s1">
<input id="p" placeholder="O teu nome" autocomplete="off">
<input id="d" list="dl" placeholder="O teu destino de sonho" autocomplete="off">
<datalist id="dl"></datalist>
<button class="go" id="save">GUARDAR EM SEGREDO 🤫</button>
<p class="lock" id="cnt"></p>
</section>

<section id="cover" hidden>
<div class="cover"><div class="big">🔒</div><h2>Guardado em segredo!</h2><p class="sub">Esconde o ecrã e passa o telemóvel ao próximo amigo.</p>
<button class="btn y w" id="next">Sou o próximo 📱</button>
<button class="btn w" id="start">Somos todos: começar o sorteio 🎲</button>
<button class="btn w" id="fix">↩ Corrigir a minha sugestão</button></div>
</section>

<section id="s2" hidden>
<div id="stage" aria-live="polite"></div>
<ul id="log"></ul>
<div class="acts" id="acts" hidden><button class="btn" id="share">Partilhar 📲</button><button class="btn" id="again">Repetir sorteio 🔁</button><button class="btn" id="new">Novo sorteio</button></div>
<button class="btn w" id="fast">Acelerar ⏩</button>
</section>
</main>
<div id="toast" role="status"></div>
<script src="destinos.js"></script>
<script>
const $=s=>document.querySelector(s);
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ROAST=["Foi bom enquanto durou, {P}.","{P}, o destino não te ama.","Adeus, sonho de {P}.","{P} vai ter de aguentar o grupo a gozar.","Ouve-se o silêncio. E {P} a suspirar.","{P} já pode fingir que nunca sugeriu isto."];
const PR=["{P} é o Guia Oficial: escolhe o restaurante do primeiro jantar.","{P} cria o grupo de WhatsApp da viagem e lembra toda a gente do passaporte.","{P} leva a culpa se chover.","{P} recebe uma ronda de aplausos. Os outros pagam o café.","Se correr bem, foi de todos. Se correr mal, foi de {P}.","{P} fica a tratar das fotos de grupo. Sem desculpas."];
const pick=a=>a[Math.random()*a.length|0];
let E=[],fast=false,res=null;
try{E=JSON.parse(localStorage.getItem("sorteio-fisico")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("sorteio-fisico",JSON.stringify(E))}catch(e){}};
const find=n=>D.find(d=>norm(d.n)===norm(n));
const show=id=>["s1","cover","s2"].forEach(x=>$("#"+x).hidden=x!==id);
const join=a=>a.length>1?a.slice(0,-1).join(", ")+" e "+a[a.length-1]:a[0];
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};
$("#dl").innerHTML=D.map(d=>`<option value="${esc(d.n)}">`).join("");
function count(){$("#cnt").textContent=E.length?"🤫 "+E.length+(E.length===1?" sugestão guardada":" sugestões guardadas")+". Ninguém sabe quais.":"Ainda ninguém sugeriu."}
$("#save").onclick=()=>{const p=$("#p").value.trim(),d=$("#d").value.trim();
  if(!p||!d){toast("Falta o nome ou o destino");return}
  const f=find(d);E.push({p,d:f?f.n:d});save();$("#p").value=$("#d").value="";count();
  $("#start").disabled=E.length<2;show("cover")};
$("#next").onclick=()=>{show("s1");$("#p").focus()};
$("#fix").onclick=()=>{const l=E.pop();if(l){$("#p").value=l.p;$("#d").value=l.d;save();count()}show("s1")};
$("#start").onclick=run;$("#again").onclick=run;
$("#new").onclick=()=>{if(confirm("Apagar tudo e começar um novo sorteio?")){E=[];save();count();show("s1")}};
$("#fast").onclick=()=>{fast=true;$("#fast").disabled=true};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function confetti(){if(RM())return;for(let i=0;i<40;i++){const s=document.createElement("span");s.className="cf";s.textContent=pick(["🎉","✈️","🏖️","🎊","🌍","🥳"]);
  s.style.left=Math.random()*100+"%";s.style.animationDuration=2.5+Math.random()*2.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}
const stage=h=>{$("#stage").innerHTML=h};
async function run(){
  if(E.length<2)return;
  show("s2");fast=false;$("#fast").disabled=false;$("#fast").hidden=false;$("#acts").hidden=true;$("#log").innerHTML="";$("#stage").className="";
  const g={};E.forEach(e=>{const k=norm(e.d);(g[k]=g[k]||{name:e.d,who:[]}).who.push(e.p)});
  const wk=norm(pick(E).d),order=shuffle(Object.keys(g).filter(k=>k!==wk)),n=order.length;
  stage('<div class="t">🥁</div><p>A preparar o sorteio...</p>');await sleep(fast?400:2000);
  for(let i=0;i<n;i++){
    const x=g[order[i]],d=find(x.name),P=join(x.who),left=n-i;
    stage(`<div class="pop"><div class="out">❌ ELIMINADO</div><div class="t">${d?d.f:"📍"} ${esc(x.name)}</div>${d?`<i>“${esc(d.s)}”</i>`:""}<p>${esc(pick(ROAST).replace("{P}",P))}</p><small>Sugerido por ${esc(P)}</small><div class="left">${left===1?"Só sobra um destino... 🥁":"Restam "+left+" destinos"}</div></div>`);
    $("#log").insertAdjacentHTML("afterbegin",`<li>${d?d.f:"📍"} ${esc(x.name)} · ${esc(P)}</li>`);
    await sleep(fast?700:(left<=2?3800:2600))}
  const x=g[wk],d=find(x.name),P=join(x.who),pr=pick(PR).replace("{P}",P);
  $("#stage").className="win";
  stage(`<div class="pop"><div class="out">🏆 O GRANDE VENCEDOR</div><div class="t">${d?d.f:"📍"} ${esc(x.name)}</div>${d?`<i>“${esc(d.s)}”</i>`:""}<p><b>${esc(pr)}</b></p><small>Sugerido por ${esc(P)}${x.who.length>1?" ("+x.who.length+" bilhetes)":""}</small></div>`);
  res={name:x.name,flag:d?d.f:"📍",s:d?d.s:"",P,pr,out:order.map(k=>g[k].name)};
  confetti();$("#acts").hidden=false;$("#fast").hidden=true}
$("#share").onclick=async()=>{if(!res)return;
  const txt=`🏆 Sorteio dos amigos: ${res.name} ${res.flag}\n${res.s?"“"+res.s+"”\n":""}Sugerido por ${res.P}. ${res.pr}\nEliminados, por ordem: ${res.out.join(", ")||"ninguém, foi unanimidade!"}\n✈️`;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);toast("Copiado! Cola no grupo")}
  catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiado! Cola no grupo")}catch(_){toast("Não deu para copiar")}a.remove()}};
count();$("#start").disabled=E.length<2;
</script>
</body>
</html>
